name: P-Bandai listing watch

on:
  schedule:
    # 5 minutes is GitHub's minimum, and scheduled runs are best-effort:
    # observed as much as 47 minutes late. Polling faster is not possible
    # here, which is why the watcher leans on advance notice instead - it
    # reads the published go-live time and warns ahead of the drop.
    - cron: "*/5 * * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write           # needed to commit state/seen.json back

# Never let two passes race on the state file.
concurrency:
  group: pbandai-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No pip install step: watcher.py is stdlib-only, so the job starts
          # in seconds and can't break on a dependency update.

      - name: Check for new listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}   # optional, only for protected topics
        run: python watcher.py --once

      - name: Persist seen-listings state
        run: |
          if [[ -z "$(git status --porcelain state/seen.json)" ]]; then
            echo "No state change."
            exit 0
          fi
          git config user.name  "pbandai-watcher"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json
          git commit -m "state: update seen listings [skip ci]"
          # Another run may have pushed while we worked; rebase and retry.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected, rebasing (attempt $attempt)..."
            git pull --rebase --autostash || true
          done
          echo "::error::Could not push state after 3 attempts."
          exit 1
