name: Daily prices and Pages

on:
  schedule:
    - cron: '37 21 * * *'
  workflow_dispatch:
  push:

permissions: {}

concurrency:
  group: optcg-pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    # Standard runners and Pages are free for public repositories.
    if: ${{ !github.event.repository.private && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Save the latest price snapshot
        if: github.event_name != 'push'
        run: |
          python3 sync_prices.py
          git add price-history/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update One Piece price history'
            git push
          fi
      - name: Stage the public app
        run: |
          mkdir _site
          cp index.html styles.css app.js collection.js data.js engine.js source.js market-analysis.js price-history.js sw.js manifest.json MARKET-BACKTEST.md _site/
          cp -r icons price-history _site/
          test "$(du -sb _site | cut -f1)" -lt 1000000000
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
