name: Daily prices and Pages

on:
  schedule:
    - cron: '37 21 * * *'
  workflow_dispatch:
  push:

permissions: {}

concurrency:
  group: optcg-pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    # Standard runners and Pages are free for public repositories.
    if: ${{ !github.event.repository.private && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/scan-reference-cache
          key: visual-orb-${{ runner.os }}-${{ hashFiles('build-scan-index.py') }}-${{ github.run_id }}
          restore-keys: |
            visual-orb-${{ runner.os }}-${{ hashFiles('build-scan-index.py') }}-
      - name: Prepare artwork matching data
        run: |
          python3 -m pip install opencv-python-headless==4.12.0.88
          python3 tests-scan-index.py
          if [ "${{ github.event_name }}" != push ]; then
            if ! python3 build-scan-index.py --cache "$RUNNER_TEMP/scan-reference-cache"; then
              test -s scan-index/manifest.json || exit 1
              echo 'Retaining the previously verified artwork index after a source failure.'
            fi
          fi
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('scan-index')
          manifest = json.loads((root / 'manifest.json').read_text())
          binary = (root / manifest['binary']).read_bytes()
          assert len(binary) == manifest['byteLength']
          assert hashlib.sha256(binary).hexdigest() == manifest['sha256']
          PY
      - name: Save daily prices and record signals
        run: |
          if [ "${{ github.event_name }}" != push ]; then python3 sync_prices.py; fi
          mkdir _site
          node track-market-signals.cjs _site/signal-performance.json
          git add price-history/ signal-ledger/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update One Piece price history'
            git push
          fi
      - name: Stage the public app
        run: |
          for file in app.js backup.js card-scan.js scan-vision.js scan-vision-worker.js collection.js data.js engine.js source.js market-analysis.js price-history.js sw.js; do node --check "$file" || exit 1; done
          node tests-cache.cjs
          node tests-scan.cjs
          node tests-camera.cjs
          node tests-vision.cjs
          node build-market-summary.cjs _site/market-summary.json
          cp index.html styles.css app.js backup.js card-scan.js scan-vision.js scan-vision-worker.js collection.js data.js engine.js source.js market-analysis.js price-history.js sw.js manifest.json MARKET-BACKTEST.md _site/
          cp -r icons price-history scan-index _site/
          test "$(du -sb _site | cut -f1)" -lt 1000000000
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
